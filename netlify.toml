[build]
  command = "pnpm run build"
  publish = ".next"

[[redirects]]
  from = "/script.js"
  to = "https://endpoint-c.longlive.cloud/script.js"
  status = 200
  force = true
  headers = { Cache-Control = "public, max-age=7200" }

[[redirects]]
  from = "/api/event"
  to = "https://endpoint-c.longlive.cloud/api/event"
  status = 200
  force = true

[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </.well-known/openapi.yaml>; rel="service-desc"; type="text/yaml", </llms.txt>; rel="describedby"; type="text/plain"'

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json; profile=\"https://www.rfc-editor.org/info/rfc9727\""
    Link = "</.well-known/api-catalog>; rel=\"api-catalog\""

[[headers]]
  for = "/.well-known/*.yaml"
  [headers.values]
    Content-Type = "text/yaml; charset=utf-8"

[[headers]]
  for = "/.well-known/http-message-signatures-directory"
  [headers.values]
    Content-Type = "application/http-message-signatures-directory+json"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"
